version: '3.8'

# Shared configuration for all environments
x-base-config: &base-config
  env_file:
    - .llm.env       # API keys (create from .llm.env.example)
    - .env           # Database and app config (create from .env.example)
  volumes:
    - /dev/shm:/dev/shm  # Chromium performance
  restart: unless-stopped
  user: "appuser"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: crawl4ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crawl4ai}
      POSTGRES_USER: ${POSTGRES_USER:-crawl4ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crawl4ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crawl4ai-network

  # Crawl4AI Backend Service
  crawl4ai:
    # 1. Default: Pull multi-platform test image from Docker Hub
    # 2. Override with local image via: IMAGE=local-test docker compose up
    image: ${IMAGE:-unclecode/crawl4ai:${TAG:-latest}}
    container_name: crawl4ai-backend

    # Local build config (used with --build)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TYPE: ${INSTALL_TYPE:-default}
        ENABLE_GPU: ${ENABLE_GPU:-false}

    # Inherit shared config
    <<: *base-config

    ports:
      - "${BACKEND_PORT:-11235}:11235"  # Backend API port

    environment:
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-crawl4ai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-crawl4ai}

      # Scheduler timezone
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Shanghai}

      # Upload directory
      UPLOAD_DIR: /app/uploads

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - crawl4ai-network

  # Frontend (Optional - uncomment to enable)
  # frontend:
  #   image: nginx:alpine
  #   container_name: crawl4ai-frontend
  #   ports:
  #     - "${FRONTEND_PORT:-8080}:80"
  #   volumes:
  #     - ./frontend/dist:/usr/share/nginx/html:ro
  #     - ./deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - crawl4ai
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - crawl4ai-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  crawl4ai-network:
    driver: bridge
